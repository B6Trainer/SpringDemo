spring:
  application:
    name: springdemoapp
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_SCHEMA:springdemo}
    username: ${MYSQL_USER:springservice}
    password: ${MYSQL_PASSWORD:demo@123}
